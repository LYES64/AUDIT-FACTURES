<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 300" width="340" height="300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e7eff0"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bfe0e4" stop-opacity=".38"/>
      <stop offset="1" stop-color="#7fb3ba" stop-opacity=".22"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f9f9"/><stop offset="1" stop-color="#e4eff0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="340" height="300" rx="16" fill="url(#bg)"/>

  <!-- back wall -->
  <path d="M22 40 H318 V214 H22 Z" fill="url(#wall)"/>
  <!-- perspective floor -->
  <path d="M22 214 H318 L300 262 H40 Z" fill="#dfe9ea"/>
  <path d="M120 214 L108 262 M210 214 L214 262 M60 214 L44 262 M280 214 L292 262" stroke="#cddcde" stroke-width="2"/>

  <!-- shadow -->
  <ellipse cx="205" cy="252" rx="118" ry="14" fill="#0F3B45" opacity=".07"/>

  <!-- shower tile panel -->
  <rect x="176" y="58" width="128" height="156" fill="#eef5f5"/>
  <path d="M176 100 H304 M176 142 H304 M176 184 H304 M220 58 V214 M262 58 V214" stroke="#dbe8e9" stroke-width="1.6"/>

  <!-- extra-flat tray -->
  <rect x="170" y="206" width="140" height="12" rx="3" fill="#0F3B45"/>
  <rect x="196" y="210" width="60" height="3.2" rx="1.6" fill="#5b7c82"/>

  <!-- thermostatic column -->
  <rect x="284" y="86" width="7" height="96" rx="3.5" fill="#25555f"/>
  <!-- rain head -->
  <rect x="256" y="72" width="44" height="10" rx="5" fill="#2f6a75"/>
  <ellipse cx="278" cy="82" rx="20" ry="4" fill="#3a7c88"/>
  <!-- water -->
  <g stroke="#bfe3e8" stroke-width="2.4" stroke-linecap="round" opacity=".9">
    <line x1="266" y1="88" x2="264" y2="150"/><line x1="274" y1="88" x2="273" y2="158"/>
    <line x1="282" y1="88" x2="283" y2="150"/><line x1="290" y1="88" x2="291" y2="156"/>
  </g>
  <!-- hand shower -->
  <rect x="286" y="120" width="5" height="26" rx="2.5" fill="#4b8089"/>

  <!-- grab bar (orange) -->
  <path d="M188 128 H250 M250 128 V168" fill="none" stroke="#DB8A38" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- fold-down seat -->
  <rect x="192" y="150" width="52" height="13" rx="4" fill="#DB8A38"/>
  <rect x="196" y="150" width="44" height="4" rx="2" fill="#c2762a"/>
  <path d="M196 163 L204 176 M236 163 L228 176" stroke="#b9c4c7" stroke-width="3" stroke-linecap="round"/>

  <!-- glass panel + chrome frame -->
  <rect x="150" y="70" width="14" height="146" rx="3" fill="#cfd8da"/>
  <rect x="150" y="70" width="8" height="146" rx="3" fill="#e6edee"/>
  <rect x="150" y="70" width="118" height="146" rx="4" fill="url(#glass)" stroke="#b9c9cc" stroke-width="2"/>
  <line x1="160" y1="80" x2="160" y2="206" stroke="#ffffff" stroke-width="3" opacity=".5"/>

  <!-- left: towel on ring -->
  <rect x="60" y="92" width="40" height="6" rx="3" fill="#b9c4c7"/>
  <rect x="66" y="96" width="28" height="60" rx="5" fill="#DB8A38"/>
  <rect x="66" y="96" width="28" height="60" rx="5" fill="url(#glass)" opacity=".15"/>
  <line x1="80" y1="100" x2="80" y2="152" stroke="#c2762a" stroke-width="2" opacity=".5"/>

  <!-- left: plant -->
  <path d="M74 200 q-16 -20 -6 -40 q10 14 6 40 Z" fill="#3f7d5a"/>
  <path d="M74 200 q16 -16 8 -36 q-10 12 -8 36 Z" fill="#4f9068"/>
  <path d="M64 206 H92 L88 224 H68 Z" fill="#DB8A38"/>
  <path d="M64 206 H92 L90.6 212 H65.4 Z" fill="#c2762a"/>
</svg>
